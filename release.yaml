interfaces:
  chat:
    implementation: upstream-plus-existing-native-multimodal-patch
    status: tested-with-real-backend
  mlx_video:
    implementation: native-typed-MLX-task-codec-and-dispatch
    status: tested-with-real-backend
    path: /v1/video/generations
    wire: mlx.video.v1
    streaming: same-wire JSON / progress SSE with final RGB8 and PCM16 payload
  embeddings:
    implementation: native task, space qualification, OpenAI codec and passthrough
    status: tested-with-real-backend
    path: /v1/embeddings
    wire: openai.embeddings.v1
  ark_embeddings:
    implementation: native Ark egress request codec and embedding response container
      conversion
    status: tested-with-real-backend
    path: /api/v3/embeddings/multimodal
    wire: ark.embeddings.v1
    client_path: /v1/embeddings
    limits: one joint text/image sample; float/base64; discrete model dimensions
limitations:
- Local OCI artifact; registry distribution is not published.
- ALP requires separately authorized private dependencies.
- ALP validation rejects invalid cloud responses; strict Function Calling enforcement
  is provider-dependent.
base_release: https://github.com/omni-runtime/semantic-router-multimodal/blob/b794a9e868bb9d930869d50c813c8d66c1e26a45/release.yaml
features:
  alp_chat:
    path: /v1/alp/chat/completions
    transport: provider-native OpenAI Chat Function Calling
    contract_source: separately authorized alp_schema_mcp dependency
    execution: host-owned; SR validates and adapts only
known_limits:
  alp_provider_generation: Strict outer Function Calling enforcement is provider-dependent;
    invalid responses are rejected.
  alp_replay: Process-local; use one router replica or sticky routing.
  verification_reports: Local only; no validation reports are published.
verification_report_policy: private
